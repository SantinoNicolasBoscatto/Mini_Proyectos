syntax = "proto3";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Pacagroup.Trade.Services.gRPC";

service Order {
	rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
	rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
	rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);
	rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
	rpc GetAllOrder(GetAllOrderRequest) returns (GetAllOrderResponse);
}

// GET
message GetOrderRequest {
	int32 Id = 1;
}
message GetOrderResponse {
	ServerResponse Response = 1;
	OrderResponse Data = 2;
}


// GET ALL
message GetAllOrderRequest {
}

message GetAllOrderResponse {
	ServerResponse Response = 1;
	repeated OrderResponse Data = 2;
}



// CREATE
message CreateOrderRequest {
	int32 Id = 1;
	string Symbol = 2;
	OrderSide Side = 3;
	google.protobuf.Timestamp TrasactionTime = 4;
	int32 Quanty = 5;
	OrderType Type = 6;
	double Price = 7;
	string Currency = 8;
	string Text = 9;
}
message CreateOrderResponse {
	ServerResponse Response = 1;
	OrderResponse Data = 2;
}


// UPDATE
message UpdateOrderRequest {
	int32 Id = 1;
	int32 Quanty = 2;
	OrderType Type = 3;
	double Price = 4;
	string Text = 5;
}
message UpdateOrderResponse {
	ServerResponse Response = 1;
	OrderResponse Data = 2;
}

// DELETE
message DeleteOrderRequest {
	int32 Id = 1;
}
message DeleteOrderResponse {
	ServerResponse Response = 1;
}

// Elementos Auxiliares
enum OrderSide{
	BUY = 0;
	SELL = 1;
}
enum OrderType{
	LIMIT = 0;
	MARKET = 1;
}

message ServerResponse{
	bool IsSuccess = 1;
	string Message = 2;
	string Errors = 3;
}

message OrderResponse{
	int32 Id = 1;
	string Symbol = 2;
	OrderSide Side = 3;
	google.protobuf.Timestamp TrasactionTime = 4;
	int32 Quanty = 5;
	OrderType Type = 6;
	double Price = 7;
	string Currency = 8;
	string Text = 9;
}